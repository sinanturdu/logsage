# LogSage services, layered on docker-compose.yml:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.app.yml --profile app up -d --build
# Kept in a separate file because ${VAR:?} is evaluated for every service in
# a file, even inactive ones; here it cannot block `up redis clickhouse`.
# Secrets come from .env without defaults, so compose fails if one is
# missing, and each service gets only the secrets it uses.

x-backend: &backend
  build:
    context: ../backend
  image: logsage-backend:dev
  profiles: ["app"]
  restart: unless-stopped

services:
  ingest:
    <<: *backend
    command: ["/usr/local/bin/ingest"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      PUBLISHER: redis
      REDIS_ADDR: redis:6379
      REDIS_STREAM: ${REDIS_STREAM:-logsage:events}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-100000}
      INGEST_API_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY in .env}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  processor:
    <<: *backend
    command: ["/usr/local/bin/processor"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROCESSOR_HTTP_ADDR: ":8081"
      REDIS_ADDR: redis:6379
      REDIS_STREAM: ${REDIS_STREAM:-logsage:events}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-100000}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logsage}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  query:
    <<: *backend
    command: ["/usr/local/bin/query"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      QUERY_HTTP_ADDR: ":8082"
      QUERY_API_KEY: ${QUERY_API_KEY:?set QUERY_API_KEY in .env}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logsage}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
