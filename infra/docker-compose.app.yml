# LogSage services, layered on docker-compose.yml:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.app.yml --profile app up -d --build
# Kept in a separate file because ${VAR:?} is evaluated for every service in
# a file, even inactive ones; here it cannot block `up redis clickhouse`.
# Secrets come from .env without defaults, so compose fails if one is
# missing, and each service gets only the secrets it uses. Ingest and query
# verify per-project keys in PostgreSQL (DATABASE_URL, built from the
# POSTGRES_* values; percent-encode special characters in the password);
# migrate applies the PostgreSQL schema once before they start. The legacy
# static keys are optional and only honored with ALLOW_LEGACY_STATIC_KEYS=true
# (off by default since v0.2.0; removed in v0.3).

x-backend: &backend
  # The context is the repository root so the image can build the dashboard
  # (frontend stage); /.dockerignore keeps secrets and local state out.
  build:
    context: ..
    dockerfile: backend/Dockerfile
  image: logsage-backend:dev
  profiles: ["app"]
  restart: unless-stopped

services:
  # One-shot: applies the PostgreSQL migrations, then exits 0.
  migrate:
    <<: *backend
    restart: "no"
    command: ["/usr/local/bin/admin", "--allow-remote", "migrate"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-logsage}?sslmode=disable"
    depends_on:
      postgres: { condition: service_healthy }

  ingest:
    <<: *backend
    command: ["/usr/local/bin/ingest"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      PUBLISHER: redis
      REDIS_ADDR: redis:6379
      REDIS_STREAM: ${REDIS_STREAM:-logsage:events}
      INGEST_MAX_STREAM_LEN: ${INGEST_MAX_STREAM_LEN:-500000}
      DATABASE_URL: "postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-logsage}?sslmode=disable"
      AUTH_CACHE_TTL: ${AUTH_CACHE_TTL:-30s}
      AUTH_NEGATIVE_TTL: ${AUTH_NEGATIVE_TTL:-5s}
      AUTH_CACHE_SIZE: ${AUTH_CACHE_SIZE:-10000}
      ALLOW_LEGACY_STATIC_KEYS: ${ALLOW_LEGACY_STATIC_KEYS:-false}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  processor:
    <<: *backend
    command: ["/usr/local/bin/processor"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROCESSOR_HTTP_ADDR: ":8081"
      REDIS_ADDR: redis:6379
      REDIS_STREAM: ${REDIS_STREAM:-logsage:events}
      PROCESSOR_TRIM_INTERVAL: ${PROCESSOR_TRIM_INTERVAL:-5s}
      PROCESSOR_LAG_WARN_AGE: ${PROCESSOR_LAG_WARN_AGE:-30s}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logsage}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  query:
    <<: *backend
    command: ["/usr/local/bin/query"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      QUERY_HTTP_ADDR: ":8082"
      DATABASE_URL: "postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-logsage}?sslmode=disable"
      AUTH_CACHE_TTL: ${AUTH_CACHE_TTL:-30s}
      AUTH_NEGATIVE_TTL: ${AUTH_NEGATIVE_TTL:-5s}
      AUTH_CACHE_SIZE: ${AUTH_CACHE_SIZE:-10000}
      ALLOW_LEGACY_STATIC_KEYS: ${ALLOW_LEGACY_STATIC_KEYS:-false}
      QUERY_API_KEY: ${QUERY_API_KEY:-}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logsage}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Management API: users, sessions, projects and keys (ADR 0013), the log
  # reads and live tail, and the dashboard itself (ADR 0021) on
  # http://localhost:8083. Behind plain http (local), set COOKIE_SECURE=false;
  # with COOKIE_SECURE=true (TLS terminated in front) it also sends HSTS.
  api:
    <<: *backend
    command: ["/usr/local/bin/api"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HTTP_ADDR: ":8083"
      DATABASE_URL: "postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-logsage}?sslmode=disable"
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-12h}
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-168h}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
      ARGON2_MAX_CONCURRENT: ${ARGON2_MAX_CONCURRENT:-4}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_DELAY_BASE: ${LOGIN_DELAY_BASE:-1s}
      LOGIN_DELAY_MAX: ${LOGIN_DELAY_MAX:-15m}
      LOGIN_LIMITER_SIZE: ${LOGIN_LIMITER_SIZE:-10000}
      # The dashboard and its runtime config (/config.json).
      WEB_ENABLED: ${WEB_ENABLED:-true}
      PUBLIC_INGEST_URL: ${PUBLIC_INGEST_URL:-http://localhost:8080}
      # Log read endpoints (ADR 0014): ClickHouse only, no Redis, no API keys.
      # They use the same QUERY_* limits as cmd/query.
      API_MAX_CONCURRENT_QUERIES: ${API_MAX_CONCURRENT_QUERIES:-4}
      # Live tail (ADR 0015).
      TAIL_POLL_INTERVAL: ${TAIL_POLL_INTERVAL:-1s}
      TAIL_BATCH: ${TAIL_BATCH:-200}
      TAIL_HEARTBEAT: ${TAIL_HEARTBEAT:-15s}
      TAIL_MAX_DURATION: ${TAIL_MAX_DURATION:-1h}
      TAIL_AUTH_RECHECK: ${TAIL_AUTH_RECHECK:-30s}
      TAIL_MAX_REPLAY: ${TAIL_MAX_REPLAY:-5m}
      TAIL_MAX_LATENESS: ${TAIL_MAX_LATENESS:-10m}
      TAIL_OVERLAP: ${TAIL_OVERLAP:-30s}
      TAIL_WRITE_TIMEOUT: ${TAIL_WRITE_TIMEOUT:-10s}
      TAIL_RETRY_MAX: ${TAIL_RETRY_MAX:-30s}
      TAIL_MAX_CONN_USER: ${TAIL_MAX_CONN_USER:-2}
      TAIL_MAX_CONN_PROJECT: ${TAIL_MAX_CONN_PROJECT:-10}
      TAIL_MAX_CONN_TOTAL: ${TAIL_MAX_CONN_TOTAL:-50}
      TAIL_MAX_SEEN: ${TAIL_MAX_SEEN:-50000}
      QUERY_MAX_WINDOW: ${QUERY_MAX_WINDOW:-168h}
      QUERY_MAX_LIMIT: ${QUERY_MAX_LIMIT:-1000}
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:-10s}
      QUERY_MAX_TEXT_LEN: ${QUERY_MAX_TEXT_LEN:-256}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logsage}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      # Alerts (ADR 0024): rules and channels; the key seals channel URLs and secrets.
      ALERTS_ENABLED: ${ALERTS_ENABLED:-false}
      ALERTS_SECRET_KEY: ${ALERTS_SECRET_KEY:-}
      ALERTS_ALLOWED_PORTS: ${ALERTS_ALLOWED_PORTS:-}
      ALERTS_ALLOW_INSECURE_LOCAL: ${ALERTS_ALLOW_INSECURE_LOCAL:-false}
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-}
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The alert evaluator and delivery worker (ADR 0024). Its own profile:
  # start it with --profile alerts once ALERTS_ENABLED=true and
  # ALERTS_SECRET_KEY are set in .env (it refuses to start without them).
  alerts:
    <<: *backend
    profiles: ["alerts"]
    command: ["/usr/local/bin/alerts"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: "postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-logsage}?sslmode=disable"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logsage}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:-10s}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-false}
      ALERTS_SECRET_KEY: ${ALERTS_SECRET_KEY:-}
      ALERTS_HTTP_ADDR: ":8084"
      ALERTS_TICK: ${ALERTS_TICK:-5s}
      ALERTS_LATENESS: ${ALERTS_LATENESS:-60s}
      ALERTS_QUERIES_PER_CYCLE: ${ALERTS_QUERIES_PER_CYCLE:-200}
      ALERTS_CONCURRENCY: ${ALERTS_CONCURRENCY:-2}
      ALERTS_DELIVERY_CONCURRENCY: ${ALERTS_DELIVERY_CONCURRENCY:-4}
      ALERTS_MAX_ATTEMPTS: ${ALERTS_MAX_ATTEMPTS:-8}
      ALERTS_CHANNEL_RATE: ${ALERTS_CHANNEL_RATE:-30}
      ALERTS_RETENTION: ${ALERTS_RETENTION:-720h}
      INCIDENT_MERGE_WINDOW: ${INCIDENT_MERGE_WINDOW:-30m}
      INCIDENT_REOPEN_WINDOW: ${INCIDENT_REOPEN_WINDOW:-60m}
      INCIDENT_RETENTION: ${INCIDENT_RETENTION:-9600h}
      ALERTS_ALLOWED_PORTS: ${ALERTS_ALLOWED_PORTS:-}
      ALERTS_ALLOW_INSECURE_LOCAL: ${ALERTS_ALLOW_INSECURE_LOCAL:-false}
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-}
    ports: ["127.0.0.1:8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
