# Infrastructure only. The LogSage services are in docker-compose.app.yml
# (profile "app"); see README "Quick start".
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logsage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-logsage}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      # Creates the logsage database and a user reachable from the host on
      # first start (the processor also creates the database idempotently).
      CLICKHOUSE_DB: logsage
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logsage}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # Named volume: ClickHouse renames files while writing parts, which fails
    # on Docker Desktop bind mounts from a Windows filesystem.
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # AOF persistence so queued events survive a container restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    # Named volume: AOF rewrites and RDB snapshots on a Docker Desktop bind
    # mount from a Windows filesystem stalled Redis (see docs/benchmarks.md).
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  clickhouse-data:
  redis-data:
