name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet, build, test
        if: ${{ hashFiles('backend/go.mod') != '' }}
        working-directory: backend
        run: |
          go vet ./...
          go build ./...
          go test ./... -race -count=1
