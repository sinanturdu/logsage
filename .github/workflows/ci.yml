name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports: ["8123:8123"]
        env:
          # Throwaway CI container with a password user, like the local
          # compose setup: cmd/api refuses to start without CLICKHOUSE_PASSWORD.
          CLICKHOUSE_USER: logsage
          CLICKHOUSE_PASSWORD: ci-clickhouse
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          # Throwaway CI container; tests create and drop their own databases.
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet, build, test
        if: ${{ hashFiles('backend/go.mod') != '' }}
        working-directory: backend
        env:
          # Enable the Redis and ClickHouse integration tests.
          REDIS_TEST_ADDR: localhost:6379
          CLICKHOUSE_TEST_URL: http://localhost:8123
          CLICKHOUSE_TEST_USER: logsage
          CLICKHOUSE_TEST_PASSWORD: ci-clickhouse
          POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go vet ./...
          go build ./...
          go test ./... -race -count=1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t logsage-backend:ci .
      - name: Validate compose config
        env:
          # Dummy values: only the configuration is checked, nothing runs.
          INGEST_API_KEY: ci-ingest-key
          QUERY_API_KEY: ci-query-key
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          COOKIE_SECURE: "false"
          ALLOWED_ORIGINS: http://localhost:5173
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.app.yml --profile app config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.app.yml --profile app config --services | grep -qx api
          # The api service reads ClickHouse but needs no Redis.
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.app.yml --profile app config --format json             | jq -e '.services.api.environment | has("CLICKHOUSE_URL") and has("CLICKHOUSE_PASSWORD") and (has("REDIS_ADDR") | not)'
      - name: Image contains every binary
        run: docker run --rm --entrypoint ls logsage-backend:ci /usr/local/bin/ingest /usr/local/bin/processor /usr/local/bin/query /usr/local/bin/admin /usr/local/bin/api
      - name: Image serves the dashboard and keeps secrets out
        run: |
          # No .env, .dev, node_modules or .git in the image; the api binary embeds index.html.
          docker run --rm --entrypoint sh logsage-backend:ci -c 'test -z "$(find / -xdev \( -name .env -o -name .dev -o -name node_modules -o -name .git \) 2>/dev/null)"'
          docker run --rm --entrypoint sh logsage-backend:ci -c 'grep -q "<title>LogSage</title>" /usr/local/bin/api'
      - name: App profile refuses to start without secrets
        run: |
          if docker compose -f infra/docker-compose.yml -f infra/docker-compose.app.yml --profile app config --quiet 2>/dev/null; then
            echo "compose accepted the app profile without secrets" >&2
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile only)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit (report only, does not fail the build)
        continue-on-error: true
        run: npm audit
