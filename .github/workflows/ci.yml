name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet, build, test
        if: ${{ hashFiles('backend/go.mod') != '' }}
        working-directory: backend
        env:
          # Enables the Redis integration tests in internal/ingest.
          REDIS_TEST_ADDR: localhost:6379
        run: |
          go vet ./...
          go build ./...
          go test ./... -race -count=1
