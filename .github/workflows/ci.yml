name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports: ["8123:8123"]
        env:
          # Throwaway CI container: keep the passwordless default user
          # reachable over the network instead of creating credentials.
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet, build, test
        if: ${{ hashFiles('backend/go.mod') != '' }}
        working-directory: backend
        env:
          # Enable the Redis and ClickHouse integration tests.
          REDIS_TEST_ADDR: localhost:6379
          CLICKHOUSE_TEST_URL: http://localhost:8123
        run: |
          go vet ./...
          go build ./...
          go test ./... -race -count=1
